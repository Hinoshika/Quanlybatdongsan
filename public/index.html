<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Bản đồ</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        #map {
            height: 100vh;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <script>
        // 1. tạo map
        var map = L.map('map').setView([21.0285, 105.8542], 12);

        // 2. load OSM tile
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 3. gọi API Hồ Tây
        fetch("http://localhost:3000/ho-tay")
            .then(res => res.json())
            .then(data => {

                const geo = JSON.parse(data.geojson);

                L.geoJSON(geo, {
                    style: {
                        color: "blue",
                        fillColor: "cyan",
                        fillOpacity: 0.3
                    }
                }).addTo(map);

            });

    </script>

</body>

</html>
